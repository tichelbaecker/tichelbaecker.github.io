<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6b4b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d3d2b" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#g)"/>
  <!-- Abstract diverging arrows / polarization -->
  <line x1="200" y1="100" x2="80" y2="40" stroke="#1a6b4b" stroke-width="3" opacity="0.12" stroke-linecap="round"/>
  <line x1="200" y1="100" x2="320" y2="40" stroke="#1a6b4b" stroke-width="3" opacity="0.12" stroke-linecap="round"/>
  <line x1="200" y1="100" x2="70" y2="160" stroke="#1a6b4b" stroke-width="3" opacity="0.12" stroke-linecap="round"/>
  <line x1="200" y1="100" x2="330" y2="160" stroke="#1a6b4b" stroke-width="3" opacity="0.12" stroke-linecap="round"/>
  <circle cx="200" cy="100" r="8" fill="#1a6b4b" opacity="0.15"/>
  <circle cx="80" cy="40" r="12" fill="#1a6b4b" opacity="0.10"/>
  <circle cx="320" cy="40" r="12" fill="#1a6b4b" opacity="0.10"/>
  <circle cx="70" cy="160" r="10" fill="#1a6b4b" opacity="0.10"/>
  <circle cx="330" cy="160" r="10" fill="#1a6b4b" opacity="0.10"/>
  <!-- Subtle dividing line -->
  <line x1="200" y1="10" x2="200" y2="190" stroke="#1a6b4b" stroke-width="1" opacity="0.06" stroke-dasharray="6,4"/>
</svg>
